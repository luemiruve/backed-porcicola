# Perfil para desarrollo local contra el Postgres de docker-compose.yml.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=local
#      (o -Dspring.profiles.active=local en el jar empaquetado)
spring.datasource.url=jdbc:postgresql://localhost:5432/porcicola
spring.datasource.username=porcicola
spring.datasource.password=porcicola

spring.security.user.name=admin
spring.security.user.password=1234

jwt.secret=Porcicola_Local_Dev_Secret_Key_No_Usar_En_Produccion!
jwt.expiration=86400000

# Postgres local propio: sin limite de conexiones de Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
